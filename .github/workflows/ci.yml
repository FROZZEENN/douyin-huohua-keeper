name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消上一次还在跑的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ===========================================================================
  # 静态检查 —— 最快，放第一个，失败了后面的就不用等了
  # ===========================================================================
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装 ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src tests scripts

      - name: ruff format --check
        run: ruff format --check src tests scripts

  # ===========================================================================
  # 测试 —— 多版本矩阵，确保 3.11 到 3.13 都能跑
  # ===========================================================================
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      # 单元测试不需要浏览器，单独跑一遍能快速暴露问题
      - name: 单元测试
        run: pytest tests/unit -m unit

      # 集成测试需要浏览器；装 Chromium 在 Linux 上要带系统依赖
      - name: 安装 Chromium（集成测试用）
        run: python -m playwright install --with-deps chromium

      - name: 集成测试
        run: pytest tests/integration -m integration

      - name: 全量测试 + 覆盖率
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: 上传覆盖率报告
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  # ===========================================================================
  # 自检脚本 —— 它本身也是一段会被用户直接运行的代码，得确保它能跑
  # ===========================================================================
  healthcheck-script:
    name: 自检脚本可用性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: 跑自检（JSON 模式，缺依赖时报错是预期行为）
        run: |
          python scripts/healthcheck.py --json > /tmp/hc.json || true
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/hc.json").read_text())
          assert "checks" in data, "输出里没有 checks 字段"
          assert len(data["checks"]) >= 10, f"检查项太少：{len(data['checks'])}"
          names = {c["name"] for c in data["checks"]}
          for required in ("Python 版本", "Chromium", "数据目录", "时区"):
              assert required in names, f"缺少检查项：{required}"
          print(f"自检脚本输出正常，共 {len(data['checks'])} 项检查")
          PY

  # ===========================================================================
  # Docker 构建 —— 确保镜像还能建出来
  # ===========================================================================
  docker:
    name: Docker 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: douyin-huohua-keeper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试 —— 镜像能起来且自检脚本不崩
        run: |
          docker run --rm \
            -e HUOHUA_TOKEN=ci-dummy-token-for-smoke-test \
            -e HUOHUA_HEADLESS=true \
            douyin-huohua-keeper:ci \
            python scripts/healthcheck.py --json || true

      - name: 确认没把敏感文件打进镜像
        run: |
          set -e
          # 这几个路径绝不能出现在镜像里
          for path in /app/data/accounts /app/.env; do
            if docker run --rm douyin-huohua-keeper:ci test -e "$path"; then
              echo "错误：$path 不应存在于镜像中"
              exit 1
            fi
          done
          echo "镜像内容检查通过"

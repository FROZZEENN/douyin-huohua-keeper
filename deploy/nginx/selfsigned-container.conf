# =============================================================================
# douyin-huohua-keeper —— nginx TLS 终止 + 反向代理（【容器 + 自签证书】版）
#
# 与本目录另一份 `douyin-huohua-keeper.conf` 的区别：
#   - 本文件：给 **docker-compose 里的 nginx 容器** 用，自签证书，**免域名/免备案**，
#             proxy_pass 走容器服务名 keeper:8787。配套 docker-compose.https.yml。
#   - 那份： 给 **宿主机装的 nginx** 用，走 certbot/Let's Encrypt，**需要域名**，
#             upstream 指向宿主 127.0.0.1:8787。二选一，不要同时用。
#
# 挂载点：/etc/nginx/conf.d/default.conf（覆盖镜像自带的 :80 默认站点，
# 容器内只监听 443；宿主只发布 443，不碰 80，避开“未备案 80 端口拦截”）。
# =============================================================================

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  _;

    # 自签证书（由 deploy/nginx/gen-selfsigned.sh 生成，挂载进 /etc/nginx/certs）
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 刻意不发 HSTS：自签证书下浏览器本就告警，加 HSTS 会让“继续访问”更难绕过，
    # 且日后想去掉很麻烦。

    # 响应头加固（不含 HSTS）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header X-Frame-Options        "DENY" always;

    # 二维码 / 接口响应可能偏大，放宽请求体
    client_max_body_size 32m;

    # 反代到 keeper 容器：同一 compose 网络内用服务名当主机名
    location / {
        proxy_pass         http://keeper:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # 扫码 poll / 同步好友等操作较慢，给足超时
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }
}

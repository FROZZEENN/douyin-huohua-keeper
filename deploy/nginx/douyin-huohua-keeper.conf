# =============================================================================
# douyin-huohua-keeper —— Nginx 反向代理
#
# 作用：
#   1. 套 HTTPS（工作台里会出现抖音登录二维码，明文传输不合适）
#   2. 限制来源 IP，避免工作台被随便扫描到
#   3. 可选地加一层 HTTP Basic（和 HUOHUA_TOKEN 形成双保险）
#
# 部署：
#   sudo cp deploy/nginx/douyin-huohua-keeper.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/douyin-huohua-keeper.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书（certbot 会自动改写下面 ssl_certificate 那几行）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d huohua.example.com
# =============================================================================

# -----------------------------------------------------------------------------
# 限流：工作台上不会有高频请求，但扫码轮询是每秒一次的
# 给个宽松但存在的上限，防止有人拿它当免费探测入口
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=huohua_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=huohua_login:10m rate=5r/m;

upstream huohua_backend {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name huohua.example.com;

    # certbot 接管前先把 HTTP 全跳走
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name huohua.example.com;

    # --- 证书（certbot 会填好）------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/huohua.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huohua.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- 安全响应头 ----------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # 工作台是本机页面，不需要外部资源
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
        always;

    # --- 来源限制 ------------------------------------------------------------
    # 改成你自己的固定出口 IP，或者直接删掉这几行（那就必须依赖 HUOHUA_TOKEN）
    # allow 203.0.113.7;
    # allow 2001:db8::/32;
    # deny all;

    # --- 通用设置 ------------------------------------------------------------
    client_max_body_size 32m;      # 上传图片素材
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # 扫码和后端操作可能耗时较长，别让 nginx 提前断开
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # --- 二维码接口不缓存 ----------------------------------------------------
    # 二维码每次请求都要新的；缓存会导致扫到过期码然后一头雾水
    location ~ ^/api/accounts/[^/]+/qrcode {
        limit_req zone=huohua_login burst=5 nodelay;
        proxy_pass http://huohua_backend;

        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # --- 健康检查 ------------------------------------------------------------
    location = /api/health {
        access_log off;
        proxy_pass http://huohua_backend;
    }

    # --- 其余 API ------------------------------------------------------------
    location /api/ {
        limit_req zone=huohua_api burst=60 nodelay;
        proxy_pass http://huohua_backend;
    }

    # --- 前端静态资源 --------------------------------------------------------
    location / {
        proxy_pass http://huohua_backend;
    }
}
